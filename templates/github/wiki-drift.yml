---
# Optional: install in the WIKI repo only after configuring the source.
name: llm-wiki-remote-signal
"on":
  repository_dispatch:
    types: [llm-wiki-drift]
permissions:
  contents: read
concurrency:
  group: wiki-remote-signals
  cancel-in-progress: false
jobs:
  ticket:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record revision signal (no path or LLM check)
        env:
          SOURCE_ID: ${{ github.event.client_payload.source_id }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          NEW_REV: ${{ github.event.client_payload.new_rev }}
        run: python scripts/cloud_signal.py
      - name: Commit only drift signals
        run: |
          git config user.name "llm-wiki-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue/drift
          git diff --cached --quiet && exit 0
          git commit -m "Record source revision signal"
          git push
