---
# Optional: install in the CODE repo. Dispatch only; no shallow-history diff.
# Secrets: WIKI_TOKEN (scoped to destination repo), WIKI_REPO (owner/repo).
# Repository variable WIKI_SOURCE: registered source ID (defaults to repo name).
name: llm-wiki-dispatch
"on":
  push:
    branches: [main, master]
permissions: {}
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Notify wiki
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN }}
          WIKI_REPO: ${{ secrets.WIKI_REPO }}
          SOURCE_ID: ${{ vars.WIKI_SOURCE || github.event.repository.name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          NEW_REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$WIKI_REPO"
          jq -n --arg id "$SOURCE_ID" --arg repo "$SOURCE_REPOSITORY" \
            --arg rev "$NEW_REV" \
            '{event_type: "llm-wiki-drift", client_payload: {
              source_id: $id, repository: $repo, new_rev: $rev
            }}' | gh api "repos/$WIKI_REPO/dispatches" --input -
