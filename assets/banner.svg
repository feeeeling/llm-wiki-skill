    <text x="54" y="43">LOCAL FILES. LINKED IDEAS.</text>
    <text x="1146" y="43" text-anchor="end">AN AGENT SKILL</text>
  </g>
  <text x="50" y="204" fill="#233522" font-family="Georgia, 'Times New Roman', serif" font-size="112" letter-spacing="-6">llm-wiki</text>
  <text x="56" y="262" fill="#233522" font-family="Georgia, 'Times New Roman', serif" font-size="34">Knowledge worth keeping.</text>
  <g fill="#56614e" font-family="'Courier New', monospace" font-size="17">
