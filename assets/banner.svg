<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">llm-wiki — Knowledge worth keeping.</title>
  <desc id="desc">An open notebook connects source documents to a growing network of knowledge. Local files, linked ideas, and versioned changes.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d9d8c8" stroke-width="0.7"/>
